name: Release

# Builds the sdist + wheel on every `v*` tag and publishes to PyPI via
# trusted publishing (OIDC). No long-lived secrets in the repo.
#
# One-off PyPI setup before this workflow can publish:
# 1. Create / claim the `git-agent-ratchet` project on https://pypi.org
# 2. Under "Publishing" -> "Add a new publisher", configure GitHub Actions:
#    owner = monk-eee
#    repository = git-agent-ratchet
#    workflow = release.yml
#    environment = pypi
# Until step 2 is done the publish step will fail; the build step still
# produces verifiable artefacts via attachments.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Build distribution
        run: uv build

      - name: Upload distribution
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish:
    name: publish to PyPI (trusted publisher)
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: pypi
      url: https://pypi.org/p/git-agent-ratchet
    permissions:
      id-token: write
    steps:
      - name: Download distribution
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
          print-hash: true
