[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "git-agent-ratchet"
version = "1.3.0"
description = "A programmatic git ratchet system for automated agent guarding."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Monkee Magic & Git Ratchet Core" },
]
keywords = ["pre-commit", "git", "ratchet", "agents", "llm", "ai", "lint"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "pre-commit>=3.7",
    "diff-cover>=9.0",
]

[project.urls]
Homepage = "https://github.com/monk-eee/git-agent-ratchet"
Issues = "https://github.com/monk-eee/git-agent-ratchet/issues"

[project.scripts]
git-agent-ratchet = "git_agent_ratchet.cli:main"
ratchet-no-duplicate-helpers = "git_agent_ratchet.hooks.no_duplicate_helpers:main"
ratchet-deny-agent-chatter = "git_agent_ratchet.hooks.deny_agent_chatter:main"
ratchet-anti-bypass = "git_agent_ratchet.hooks.anti_bypass:main"
ratchet-max-file-lines = "git_agent_ratchet.hooks.max_file_lines:main"
ratchet-no-cross-module-private-import = "git_agent_ratchet.hooks.no_cross_module_private_import:main"
ratchet-no-print-outside-allowlist = "git_agent_ratchet.hooks.no_print_outside_allowlist:main"
ratchet-no-temporary-comments = "git_agent_ratchet.hooks.no_temporary_comments:main"
ratchet-dont-use-powershell = "git_agent_ratchet.hooks.dont_use_powershell:main"

[tool.hatch.build.targets.wheel]
packages = ["git_agent_ratchet"]

[tool.hatch.build.targets.sdist]
include = [
    "git_agent_ratchet",
    "tests",
    "docs",
    ".pre-commit-hooks.yaml",
    "README.md",
    "AGENTS.md",
    "LICENSE",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = ["-ra", "--strict-markers", "--strict-config"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["git_agent_ratchet"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 95
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
src = [".", "tests"]
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.lint.per-file-ignores]
# Tests may use longer lines for fixture strings; tracked debt only if grown.
"tests/**" = ["E501"]
