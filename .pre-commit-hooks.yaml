- id: ratchet-no-duplicate-helpers
  name: git-agent-ratchet | no duplicate private helpers
  description: >-
    Fail when the count of duplicate private helper functions across the target
    directory exceeds the recorded baseline. Auto-shrinks the baseline on cleanup.
  entry: ratchet-no-duplicate-helpers
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit, manual]

- id: ratchet-deny-agent-chatter
  name: git-agent-ratchet | deny agent chatter
  description: >-
    Block conversational agent preamble and postscript artifacts from being
    committed to text files.
  entry: ratchet-deny-agent-chatter
  language: python
  types: [text]
  stages: [pre-commit, manual]

- id: ratchet-anti-bypass
  name: git-agent-ratchet | anti-bypass guard
  description: >-
    Block automated processes from mutating protected ratchet configuration files
    unless HUMAN_RATCHET_BYPASS_KEY is set in the environment.
  entry: ratchet-anti-bypass
  language: python
  pass_filenames: true
  stages: [pre-commit, manual]

- id: ratchet-max-file-lines
  name: git-agent-ratchet | max file lines
  description: >-
    Fail when the total line overage across over-sized source files exceeds the
    recorded baseline. Auto-shrinks the baseline when files contract.
  entry: ratchet-max-file-lines
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit, manual]

- id: ratchet-no-cross-module-private-import
  name: git-agent-ratchet | no cross-module private imports
  description: >-
    Fail when the count of cross-module imports of underscore-prefixed names
    (e.g. `from pkg.mod import _foo`) exceeds the recorded baseline. Privacy
    convention: leading-underscore names belong to their defining module.
  entry: ratchet-no-cross-module-private-import
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit, manual]

- id: ratchet-no-print-outside-allowlist
  name: git-agent-ratchet | no print() outside allowlist
  description: >-
    Fail when the count of `print()` calls outside the allowlisted path prefixes
    (CLI / hook shims) exceeds the recorded baseline. Production modules use
    `logging.getLogger(__name__)`.
  entry: ratchet-no-print-outside-allowlist
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit, manual]

- id: ratchet-no-temporary-comments
  name: git-agent-ratchet | no temporary-comment markers
  description: >-
    Fail when the count of 'for now' / 'back-compat' / 'transitional bridge' /
    'TODO: remove once' markers exceeds the recorded baseline. These are the
    calcified-shortcut tells; the comment is the smell.
  entry: ratchet-no-temporary-comments
  language: python
  pass_filenames: false
  always_run: true
  stages: [pre-commit, manual]

- id: ratchet-dont-use-powershell
  name: git-agent-ratchet | dont use powershell
  description: >-
    Block staged text that contains PowerShell usage (powershell/pwsh,
    .ps1 references, and common cmdlets). Use cross-platform alternatives.
  entry: ratchet-dont-use-powershell
  language: python
  types: [text]
  stages: [pre-commit, manual]
