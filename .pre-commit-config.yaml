# This repo dogfoods itself: every commit runs the very ratchets it ships.
# Standard hygiene + ruff + the three ratchets, in that order.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: mixed-line-ending
        args: ["--fix=lf"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.7
    hooks:
      - id: ruff
        args: ["--fix", "--exit-non-zero-on-fix"]
      - id: ruff-format

  # Ratchet A -- AST scan for duplicate private helpers.
  # Uses the local install so we always test the working copy of the package.
  - repo: local
    hooks:
      - id: ratchet-no-duplicate-helpers
        name: ratchet | no duplicate private helpers
        entry: uv run git-agent-ratchet no-duplicate-helpers
        args:
          - --baseline=config/ratchets/duplicates.json
          - --dir=git_agent_ratchet
        language: system
        pass_filenames: false
        always_run: true

      - id: ratchet-deny-agent-chatter
        name: ratchet | deny agent chatter
        entry: uv run git-agent-ratchet deny-agent-chatter
        language: system
        types: [text]

      - id: ratchet-anti-bypass
        name: ratchet | anti-bypass guard
        entry: uv run git-agent-ratchet anti-bypass
        args:
          - --enforce-files=AGENTS.md,.pre-commit-config.yaml,config/ratchets/duplicates.json,config/ratchets/file_lines.json,config/ratchets/private_imports.json,config/ratchets/print_calls.json,config/ratchets/temporary_comments.json,.pre-commit-hooks.yaml
        language: system
        pass_filenames: true

      - id: ratchet-max-file-lines
        name: ratchet | max file lines
        entry: uv run git-agent-ratchet max-file-lines
        args:
          - --baseline=config/ratchets/file_lines.json
          - --dir=git_agent_ratchet
          - --max=350
        language: system
        pass_filenames: false
        always_run: true

      - id: ratchet-no-cross-module-private-import
        name: ratchet | no cross-module private imports
        entry: uv run git-agent-ratchet no-cross-module-private-import
        args:
          - --baseline=config/ratchets/private_imports.json
          - --dir=git_agent_ratchet
        language: system
        pass_filenames: false
        always_run: true

      - id: ratchet-no-print-outside-allowlist
        name: ratchet | no print() outside allowlist
        entry: uv run git-agent-ratchet no-print-outside-allowlist
        args:
          - --baseline=config/ratchets/print_calls.json
          - --dir=git_agent_ratchet
          - --allow-prefix=git_agent_ratchet/hooks
          - --allow-prefix=git_agent_ratchet/cli.py
        language: system
        pass_filenames: false
        always_run: true

      - id: ratchet-no-temporary-comments
        name: ratchet | no temporary-comment markers
        entry: uv run git-agent-ratchet no-temporary-comments
        args:
          - --baseline=config/ratchets/temporary_comments.json
          - --dir=git_agent_ratchet
        language: system
        pass_filenames: false
        always_run: true
